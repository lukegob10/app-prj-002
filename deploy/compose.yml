services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args:
        TREASURY_ANALYTICS_PACKAGE: ${TREASURY_ANALYTICS_PACKAGE:-}
      secrets:
        - pip_extra_index_url
    image: agora-backend:local
    container_name: agora-backend
    restart: unless-stopped
    env_file:
      - .env.runtime
    environment:
      ENV: PROD
      AGORA_USE_TREASURY_ANALYTICS: ${AGORA_USE_TREASURY_ANALYTICS:-0}
    networks:
      - agora
      - oracle
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/live', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5

  scheduler:
    image: agora-backend:local
    container_name: agora-scheduler
    restart: unless-stopped
    command: ["python", "-m", "agora.data.scheduler_worker"]
    env_file:
      - .env.runtime
    environment:
      ENV: PROD
      AGORA_USE_TREASURY_ANALYTICS: ${AGORA_USE_TREASURY_ANALYTICS:-0}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - agora
      - oracle

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    image: agora-frontend:local
    container_name: agora-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8082:80"
    networks:
      - agora

networks:
  agora:
  oracle:
    external: true
    name: oracle-free_default

secrets:
  pip_extra_index_url:
    file: ./secrets/pip_extra_index_url
